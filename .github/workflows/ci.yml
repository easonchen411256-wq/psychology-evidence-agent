name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/psychology_evidence_agent
      - name: Test
        run: pytest
      - name: Check generated schemas
        run: pea schemas check
      - name: Build wheel
        run: python -m build
      - name: Wheel smoke test
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          PEA_SKIP_CODEX_CHECK=1 "$GITHUB_WORKSPACE/.wheel-smoke/bin/pea" doctor
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -c "from psychology_evidence_agent.resources import load_default_config, load_prompt, load_schema, web_directory; assert load_default_config('default.literature_search.json'); assert load_prompt('system_prompt.md'); assert load_schema('evidence_card.schema.json'); assert (web_directory() / 'index.html').is_file()"
