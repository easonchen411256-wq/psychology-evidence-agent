[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psychology-evidence-agent"
version = "0.1.0"
description = "A local, human-in-the-loop evidence workflow for psychology literature research."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Eason Chen", email = "easonchen411256-wq@users.noreply.github.com" }]
maintainers = [{ name = "Eason Chen", email = "easonchen411256-wq@users.noreply.github.com" }]
dependencies = [
  "pydantic>=2,<3",
  "pypdf>=6,<7",
  "jsonschema>=4,<5",
  "python-docx>=1.1,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-jsonschema>=4.23,<5",
  "build>=1.2,<2",
]

[project.scripts]
pea = "psychology_evidence_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psychology_evidence_agent = [
  "resources/prompts/*.md",
  "resources/schemas/*.json",
  "resources/configs/*.json",
  "resources/web/*.html",
  "resources/web/*.js",
  "resources/web/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning:starlette\\.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
